name: Deploy to Firebase

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
    
    - name: Install Cloud Functions dependencies
      run: |
        cd functions
        npm install
        cd ..
    
    - name: Create Firebase config
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-key.json
    
    - name: Deploy Functions and Indexes only
      env:
        GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
      run: firebase deploy --project mizanora-market --only firestore:indexes,functions
