name: Deploy to Firebase

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
    
    - name: Install Cloud Functions dependencies
      run: |
        cd functions
        npm install
        cd ..
    
    - name: Create Firebase config
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-key.json
    
    - name: Create WhatsApp Catalog env file
      env:
        WHATSAPP_CATALOG_ID: ${{ secrets.WHATSAPP_CATALOG_ID }}
        WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      run: |
        echo "WHATSAPP_CATALOG_ID=$WHATSAPP_CATALOG_ID" >> functions/.env
        echo "WHATSAPP_ACCESS_TOKEN=$WHATSAPP_ACCESS_TOKEN" >> functions/.env
    
    - name: Deploy to Firebase
      env:
        GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
      run: firebase deploy --project mizanora-market --only firestore:rules,firestore:indexes,database,functions
