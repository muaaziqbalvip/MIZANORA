name: Bootstrap First Admin

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Firebase Auth email of the first admin"
        required: true
        type: string

jobs:
  bootstrap-first-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create temporary Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ERROR: FIREBASE_SERVICE_ACCOUNT secret is missing."
            exit 1
          fi

          mkdir -p scripts

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > scripts/service-account.json

          echo "Temporary service-account.json created."

      - name: Install Firebase Admin SDK
        run: |
          npm install firebase-admin --no-save

      - name: Bootstrap first admin
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: |
          set -e

          if [ -z "$ADMIN_EMAIL" ]; then
            echo "ERROR: Admin email is required."
            exit 1
          fi

          echo "Bootstrapping Firebase admin..."
          node scripts/bootstrap-first-admin.js "$ADMIN_EMAIL"

      - name: Delete temporary service account
        if: always()
        run: |
          rm -f scripts/service-account.json
          echo "Temporary service-account.json deleted."
