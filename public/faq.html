<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>FAQ — MIZANORA</title>
<meta name="description" content="Frequently asked questions about shopping, delivery, returns, and payments at MIZANORA." />
<link rel="canonical" href="https://mizanora.example.com/faq" />
<link rel="icon" href="/assets/icons/logo-mark.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0A0A0A" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/home.css" />
<link rel="stylesheet" href="/css/static.css" />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    { "@type": "Question", "name": "How does Cash on Delivery work?", "acceptedAnswer": { "@type": "Answer", "text": "Place your order online with no upfront payment. Pay in cash to the courier when your order arrives at your doorstep." }},
    { "@type": "Question", "name": "How long does delivery take?", "acceptedAnswer": { "@type": "Answer", "text": "Most orders arrive within 3 to 5 business days across Pakistan, depending on your city." }},
    { "@type": "Question", "name": "Can I return a product?", "acceptedAnswer": { "@type": "Answer", "text": "Yes, most items can be returned within 7 days of delivery if unused and in original packaging. See our Return & Refund Policy for details." }},
    { "@type": "Question", "name": "Do I need an account to order?", "acceptedAnswer": { "@type": "Answer", "text": "No — guest checkout is fully supported. Creating an account just lets you track order history and save addresses for next time." }}
  ]
}
</script>
</head>
<body>

<header id="site-header"></header>

<div class="mz-static">
  <h1>Frequently Asked Questions</h1>
  <div id="faq-list"></div>
</div>

<footer id="site-footer"></footer>
<nav id="site-bottom-nav"></nav>

<script type="module" src="/js/env.example.js"></script>
<script type="module">
  import { renderPageChrome } from "/js/page-chrome.js";
  import { initShell } from "/js/shared.js";

  renderPageChrome("/faq");
  initShell();

  const faqs = [
    { q: "How does Cash on Delivery work?", a: "Place your order online with no upfront payment. Pay in cash to the courier when your order arrives at your doorstep." },
    { q: "How long does delivery take?", a: "Most orders arrive within 3 to 5 business days across Pakistan, depending on your city." },
    { q: "Can I track my order?", a: "Yes — use the Track Order page with your Order ID and the phone number you used at checkout to see live status." },
    { q: "Can I return a product?", a: "Most items can be returned within 7 days of delivery if unused and in original packaging. See our Return & Refund Policy for full details." },
    { q: "Do I need an account to order?", a: "No — guest checkout is fully supported. Creating an account lets you track order history, save addresses, and build a wishlist for next time." },
    { q: "What payment methods do you accept?", a: "Currently, MIZANORA supports Cash on Delivery (COD) only." },
    { q: "Is everything on MIZANORA halal?", a: "Yes — every product listed is reviewed to align with our commitment to honest, halal dealing." }
  ];

  const list = document.getElementById("faq-list");
  list.innerHTML = faqs.map((f, i) => `
    <div class="mz-faq-item" data-faq="${i}">
      <button class="mz-faq-question">
        <span>${f.q}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="mz-faq-answer"><p>${f.a}</p></div>
    </div>
  `).join("");

  list.querySelectorAll(".mz-faq-item").forEach((item) => {
    item.querySelector(".mz-faq-question").addEventListener("click", () => {
      item.classList.toggle("is-open");
    });
  });
</script>

</body>
</html>
