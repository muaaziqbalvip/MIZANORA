<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Contact Us — MIZANORA</title>
<meta name="description" content="Get in touch with the MIZANORA team for order questions, product inquiries, or support." />
<link rel="canonical" href="https://mizanora.example.com/contact" />
<link rel="icon" href="/assets/icons/logo-mark.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0A0A0A" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/home.css" />
<link rel="stylesheet" href="/css/cart.css" />
<link rel="stylesheet" href="/css/static.css" />
</head>
<body>

<header id="site-header"></header>

<div class="mz-static" style="max-width:900px;">
  <h1>Contact Us</h1>
  <p>Have a question about an order, a product, or anything else? Reach out — we're happy to help.</p>

  <div class="mz-contact-grid" style="margin-top:var(--mz-space-6);">
    <div class="mz-contact-info">
      <div class="mz-contact-info__item">
        <span id="ic-mail"></span>
        <div><strong>Email</strong><span>support@mizanora.example.com</span></div>
      </div>
      <div class="mz-contact-info__item">
        <span id="ic-phone"></span>
        <div><strong>Phone</strong><span>+92 300 0000000</span></div>
      </div>
      <div class="mz-contact-info__item">
        <span id="ic-clock"></span>
        <div><strong>Support Hours</strong><span>Mon–Sat, 10am – 7pm PKT</span></div>
      </div>
      <div class="mz-contact-info__item">
        <span id="ic-location"></span>
        <div><strong>Based in</strong><span>Kasur, Punjab, Pakistan</span></div>
      </div>
    </div>

    <form class="mz-checkout-form" id="contact-form">
      <div class="mz-checkout-alert" id="contact-success" style="display:none;background:rgba(78,159,110,0.12);border-color:var(--mz-success);color:var(--mz-success);">
        Thanks for reaching out! We'll get back to you soon.
      </div>
      <div class="mz-form-group">
        <label>Your Name</label>
        <input type="text" name="name" required />
      </div>
      <div class="mz-form-group">
        <label>Email</label>
        <input type="email" name="email" required />
      </div>
      <div class="mz-form-group">
        <label>Message</label>
        <textarea name="message" required style="min-height:120px;"></textarea>
      </div>
      <button type="submit" class="mz-btn mz-btn--primary mz-btn--lg mz-btn--full">Send Message</button>
    </form>
  </div>
</div>

<footer id="site-footer"></footer>
<nav id="site-bottom-nav"></nav>

<script type="module" src="/js/env.example.js"></script>
<script type="module">
  import { renderPageChrome } from "/js/page-chrome.js";
  import { initShell } from "/js/shared.js";
  import { icon } from "/js/utils/icons.js";

  renderPageChrome("/contact");
  initShell();

  document.getElementById("ic-mail").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>`;
  document.getElementById("ic-phone").innerHTML = icon("phone");
  document.getElementById("ic-clock").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`;
  document.getElementById("ic-location").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`;

  // NOTE: this form has no backend wired up yet — it's a UI-complete
  // placeholder. Wire it to a Cloud Function (e.g. one that writes to
  // a /contact_messages collection or emails your support inbox) before
  // relying on it in production; right now submitting only shows a
  // local success message and does not send or store anything.
  document.getElementById("contact-form").addEventListener("submit", (e) => {
    e.preventDefault();
    document.getElementById("contact-success").style.display = "block";
    e.target.reset();
  });
</script>

</body>
</html>
