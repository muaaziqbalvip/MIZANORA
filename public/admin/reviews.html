<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Reviews — MIZANORA Admin</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/icons/logo-mark.png" />
<meta name="theme-color" content="#0A0A0A" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/cart.css" />
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>

<div class="mz-admin-shell">
  <div class="mz-admin-backdrop" id="admin-backdrop"></div>
  <aside class="mz-admin-sidebar" id="admin-sidebar"></aside>

  <main class="mz-admin-main">
    <div class="mz-admin-topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="mz-admin-icon-btn mz-admin-mobile-toggle" id="admin-mobile-toggle"></button>
        <h1>Reviews</h1>
      </div>
    </div>

    <div class="mz-auth-tabs" style="max-width:320px;margin-bottom:var(--mz-space-5);">
      <button class="mz-auth-tab is-active" data-review-tab="pending">Pending</button>
      <button class="mz-auth-tab" data-review-tab="approved">Approved</button>
      <button class="mz-auth-tab" data-review-tab="rejected">Rejected</button>
    </div>

    <div id="reviews-list">
      <div class="mz-skeleton" style="height:200px;"></div>
    </div>
  </main>
</div>

<script type="module" src="/js/env.example.js"></script>
<script type="module" src="/admin/js/reviews.js"></script>

</body>
</html>
