<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Notifications — MIZANORA Admin</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/icons/logo-mark.png" />
<meta name="theme-color" content="#0A0A0A" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/cart.css" />
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>

<div class="mz-admin-shell">
  <div class="mz-admin-backdrop" id="admin-backdrop"></div>
  <aside class="mz-admin-sidebar" id="admin-sidebar"></aside>

  <main class="mz-admin-main">
    <div class="mz-admin-topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="mz-admin-icon-btn mz-admin-mobile-toggle" id="admin-mobile-toggle"></button>
        <h1>Send Notification</h1>
      </div>
    </div>

    <div class="mz-admin-panel" style="max-width:520px;padding:var(--mz-space-6);">
      <div class="mz-checkout-alert" id="send-alert"></div>
      <form class="mz-checkout-form" id="notification-form">
        <div class="mz-form-group">
          <label>Audience</label>
          <select name="audience" id="audience-select">
            <option value="all">All Customers</option>
            <option value="customer">Specific Customer</option>
          </select>
        </div>
        <div class="mz-form-group" id="customer-id-group" style="display:none;">
          <label>Customer UID</label>
          <input type="text" name="customerId" placeholder="Firebase Auth UID" />
        </div>
        <div class="mz-form-group">
          <label>Type</label>
          <select name="type">
            <option value="announcement">Announcement</option>
            <option value="promotion">Promotion</option>
            <option value="order_update">Order Update</option>
            <option value="system">System</option>
          </select>
        </div>
        <div class="mz-form-group">
          <label>Title <span class="required">*</span></label>
          <input type="text" name="title" required />
        </div>
        <div class="mz-form-group">
          <label>Message <span class="required">*</span></label>
          <textarea name="body" required></textarea>
        </div>
        <button type="submit" class="mz-btn mz-btn--primary mz-btn--lg mz-btn--full">Send Notification</button>
      </form>
    </div>
  </main>
</div>

<script type="module" src="/js/env.example.js"></script>
<script type="module" src="/admin/js/notifications.js"></script>

</body>
</html>
