<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Track Your Order — MIZANORA</title>
<meta name="description" content="Track your MIZANORA order status using your Order ID and phone number." />
<link rel="icon" href="/assets/icons/logo-mark.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0A0A0A" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/home.css" />
<link rel="stylesheet" href="/css/cart.css" />
</head>
<body>

<header class="mz-nav">
  <div class="mz-container mz-nav__inner">
    <a href="/" class="mz-nav__logo">
      <img src="/assets/icons/logo-mark.png" alt="MIZANORA" />
      <span class="mz-nav__logo-text">MIZANORA</span>
    </a>
    <nav class="mz-nav__links" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/shop">Shop</a>
      <a href="/categories">Categories</a>
      <a href="/track-order" style="color:var(--mz-gold);">Track Order</a>
    </nav>
    <div class="mz-nav__actions">
      <a href="/search" class="mz-icon-btn" aria-label="Search" id="search-icon-btn"></a>
      <a href="/wishlist" class="mz-icon-btn" aria-label="Wishlist" id="wishlist-icon-btn"></a>
      <a href="/cart" class="mz-icon-btn" aria-label="Cart">
        <span id="cart-icon-slot"></span>
        <span class="mz-cart-badge" id="cart-badge" style="display:none;">0</span>
      </a>
      <a href="/account" class="mz-icon-btn" aria-label="Account" id="account-icon-btn"></a>
      <button class="mz-icon-btn mz-nav__hamburger" id="hamburger-btn" aria-label="Menu"></button>
    </div>
  </div>
</header>

<div class="mz-container" style="padding:var(--mz-space-7) 0 var(--mz-space-8);">
  <div style="text-align:center;max-width:480px;margin:0 auto var(--mz-space-6);">
    <h1 class="mz-page-title">Track Your Order</h1>
    <p style="color:var(--mz-text-dim);font-size:0.9rem;">Enter your Order ID and the phone number used at checkout.</p>
  </div>

  <div class="mz-checkout-alert" id="track-error" style="max-width:480px;margin:0 auto var(--mz-space-4);"></div>

  <form class="mz-track-form" id="track-form">
    <div class="mz-form-group">
      <label>Order ID</label>
      <input type="text" id="track-order-id" placeholder="MZN-20260921-0001" required />
    </div>
    <div class="mz-form-group">
      <label>Phone Number</label>
      <input type="tel" id="track-phone" placeholder="03XX-XXXXXXX" required />
    </div>
    <button type="submit" class="mz-btn mz-btn--primary mz-btn--lg" id="track-submit">Track Order</button>
  </form>

  <div id="track-result" style="max-width:560px;margin:0 auto;"></div>
</div>

<footer class="mz-footer">
  <div class="mz-container">
    <div class="mz-footer__bottom" style="border-top:1px solid var(--mz-border-soft);">
      <span>© 2026 MIZANORA. All rights reserved.</span>
      <span>Made with fairness, for everyone.</span>
    </div>
  </div>
</footer>

<nav class="mz-bottom-nav" aria-label="Mobile navigation">
  <div class="mz-bottom-nav__inner">
    <a href="/"><span id="ic-bn-home"></span>Home</a>
    <a href="/shop"><span id="ic-bn-shop"></span>Shop</a>
    <a href="/categories"><span id="ic-bn-cat"></span>Categories</a>
    <a href="/wishlist"><span id="ic-bn-wish"></span>Wishlist</a>
    <a href="/account"><span id="ic-bn-acc"></span>Account</a>
  </div>
</nav>

<script type="module" src="/js/env.example.js"></script>
<script type="module" src="/js/pages/track-order.js"></script>

</body>
</html>
